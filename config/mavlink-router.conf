# Ground host. Set Device to the serial adapter attached to the Flight radio.
[General]
TcpServerPort = 0

[UartEndpoint flight_radio]
Device = /dev/ttyUSB0
Baud = 115200
FlowControl = false

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint mavsdk]
Mode = Normal
Address = 127.0.0.1
Port = 14540
