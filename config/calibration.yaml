# QUAD_X4 runtime calibration values
#
# These parameters are stored in the same session catalog as the controller
# tuning values, but they are not part of ProductControllerConfig.  The sensor
# calibration service applies them to the IMU / magnetometer / RC pipeline.
#
# Defaults describe "no correction" (zero bias, unit scale).  A value becomes
# meaningful only after the corresponding QGC calibration page completed and
# set the matching CAL_*_OK flag.  Values are session-only; a reboot restores
# the defaults and runs the bench with the compiled identity calibration.
#
# The magnetometer is currently diagnostic-only (MAG_AIDING is disabled on the
# flight image).  Its calibration is still stored so the heading can be checked
# on the bench and enabling aiding later does not require a new parameter set.

schema_version: 1
profile: QUAD_X4
status: RUNTIME_SESSION
generated_by: manual

