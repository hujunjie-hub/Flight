name: M6/M7 host validation

on:
  push:
    branches:
      - test/fmat-0012-m6-controller
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4-m5-regression:
    name: M4/M5 host and integration regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run M4 host regression
        run: bash tests/flight_management/run_host_tests.sh
      - name: Run M5 host regression
        run: bash tests/guidance/run_host_tests.sh
      - name: Run M4/M5 integration regression
        run: bash tests/guidance/run_integration_tests.sh

  m6-m7-host:
    name: M6 MPC and M7 actuator host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run M6 real-model host tests
        run: bash tests/control/run_host_tests.sh
      - name: Run M7 real-actuator-guard host tests
        run: bash tests/actuation/run_host_tests.sh
      - name: Upload M6/M7 host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-m7-host-evidence
          path: build/validation/

  m6-m7-sanitizers:
    name: M6/M7 AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run M6 host tests with sanitizers
        env:
          EXTRA_CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
        run: bash tests/control/run_host_tests.sh
      - name: Run M7 host tests with sanitizers
        env:
          EXTRA_CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
        run: bash tests/actuation/run_host_tests.sh

  cortex-m7-compile:
    name: Cortex-M7 M4/M5/M6/M7 production-module compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev
      - name: Validate ARM runner syntax
        run: python -m py_compile tests/algorithms/run_tests.py
      - name: Compile and relocatably link M6 navigation/controller
        run: python tests/algorithms/run_tests.py --target arm
      - name: Compile M4 FMS and ground-stop adapter
        run: bash tests/flight_management/arm_build_check.sh
      - name: Compile M5 guidance
        run: bash tests/guidance/arm_build_check.sh
      - name: Compile M7 actuator guard
        run: bash tests/actuation/arm_build_check.sh
      - name: Upload Cortex-M7 compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m7-module-compile
          path: |
            build/validation/controller_navigation/arm/
            build/m4_arm/
            build/m5_arm/
            build/m7_arm/

  sil-ground-stop-integration:
    name: Runtime task and M4-to-M7 ground-stop SIL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile real runtime owners and run ground-stop task smoke
        run: bash tests/simulation/run_sil.sh
      - name: Upload SIL integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-ground-stop-evidence
          path: build/validation/sim/sil/
