name: Host validation

on:
  push:
    branches:
      - main
      - "opt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-validation-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  source-and-time:
    name: Source layout and time-service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python validation scripts
        run: |
          python -m py_compile tools/check_layout.py tests/algorithms/run_tests.py tests/algorithms/test_source_lock.py middleware/model/control/outer_loop/quad_x4/mpc_solver/osqp/source_lock.py tests/runtime/run_tests.py tests/runtime/verify_firmware.py tests/drivers/check_drivers.py tools/guidance/generate_kinodynamic_primitives.py tests/guidance/verify_norm_bounds.py tests/guidance/verify_dynamic_prediction.py tests/guidance/verify_curve_eval_gap.py

      - name: Check source layout
        run: python tools/check_layout.py

      - name: Check shell script line endings
        run: python tools/check_line_endings.py

      - name: Test python -O audit guard
        run: python tests/guidance/test_audit_optimized.py

      - name: Check generated Kinodynamic primitive table
        run: python tools/guidance/generate_kinodynamic_primitives.py --check

      - name: Test OSQP source-lock generator
        run: python tests/algorithms/test_source_lock.py

      - name: Build time-service host test
        run: gcc -std=c99 -O2 -Wall -Wextra -Werror -Imiddleware/contracts -Isensor_device/time_base sensor_device/time_base/systime.c tests/time/test_time_service.c -o /tmp/test_time_service

      - name: Run time-service host test
        run: /tmp/test_time_service

  algorithm-arm:
    name: Cortex-M7 compile and MPC RAM checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev

      - name: Compile and inspect Cortex-M7 objects
        run: python tests/algorithms/run_tests.py --target arm

      - name: Compile M4/M5 production sources for Cortex-M7
        run: bash tests/guidance/arm_build_check.sh

      - name: Check consumer floating-point contraction
        run: python tests/guidance/check_consumer_fp_contraction.py

      - name: Upload M5 ARM compile evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-cortex-m7-compile
          path: build/m5_arm/

  algorithm-host:
    name: Navigation and control host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Run algorithm and M3 bridge tests
        run: python tests/algorithms/run_tests.py --target host

  m4-m5-regression:
    name: M4/M5 host, integration and sanitizer regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p build/ci/m4-m5

      - name: Run M4 host regression
        run: |
          set -o pipefail
          bash tests/flight_management/run_host_tests.sh | tee build/ci/m4-m5/m4_host.log

      - name: Run M5 host regression
        run: |
          set -o pipefail
          bash tests/guidance/run_host_tests.sh | tee build/ci/m4-m5/m5_host.log

      - name: Run M4/M5 integration regression
        run: |
          set -o pipefail
          bash tests/guidance/run_integration_tests.sh | tee build/ci/m4-m5/m4_m5_integration.log

      - name: Run M5 AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          EXTRA_CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
        run: |
          set -o pipefail
          bash tests/guidance/run_host_tests.sh | tee build/ci/m4-m5/m5_sanitizer.log

      - name: Run M4/M5 integration sanitizers
        env:
          EXTRA_CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
        run: |
          set -o pipefail
          bash tests/guidance/run_integration_tests.sh | tee build/ci/m4-m5/m4_m5_sanitizer.log

      - name: Upload M4/M5 regression evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-m5-host-regression
          path: |
            build/ci/m4-m5/
            build/m4_host/
            build/m5_host/
            build/m4_m5_host/

  src-spec-audit:
    name: Spec audit
    runs-on: ubuntu-latest
    # Transitional: spec/validation/dialect_report.json still pins the CRLF
    # hash of FCU.xml, so round 3 fails on an LF checkout until the owner
    # approves the re-baseline in spec/validation/eol_hash_rebaseline_analysis.md.
    # Round 1 (document, registry, ABI compile) is independent and must not be
    # skipped because of that. The job is blocking: a stale evidence baseline
    # must make CI red, never disappear behind an overall SUCCESS.
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Run spec audit (round 1)
        run: python spec/tools/audit_spec.py --round 1 --label ci

  src-abi-report:
    name: Production ABI report
    runs-on: ubuntu-latest
    # Separate job so a spec-audit failure can never skip the ABI evidence.
    # Blocking on purpose: the ABI evidence must be visible in CI status.
    # The CRLF baseline is still awaiting owner re-baseline approval.
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Run production ABI report
        run: python tests/abi/abi_report.py

      - name: Upload ABI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-evidence
          path: tests/abi/evidence/

