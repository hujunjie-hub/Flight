# ============================================================
#  OpenOCD configuration - STM32H723ZGTx  +  ST-Link
#  Debug probe : ST-Link V3 MINIE, SWD interface
#  Target      : STM32H723ZGTx (Cortex-M7, single core)
#  Usage       : openocd -f cfg/stlink.cfg
# ============================================================

# --- ST-Link probe ---
adapter driver st-link

# --- Debug transport: SWD ---
transport select swd

# --- Work area (RAM scratch) for flash loader: 1M ---
set FLASH_SIZE 0x100000

# --- STM32H7 target definition (auto-detects CPU/flash) ---
source [find target/stm32h7x.cfg]

# --- SWD clock speed in kHz (V3 mini rated up to 24000) ---
# MUST stay below the target source: stm32h7x.cfg resets "adapter speed 4000"
# and overrides anything set earlier (same trap fixed in daplink.cfg,
# 2026-10-01).
adapter speed 15000
