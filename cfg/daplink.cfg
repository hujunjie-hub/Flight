# ============================================================
#  OpenOCD configuration - STM32H723ZGTx  +  DAPLink (CMSIS-DAP)
#  Debug probe : DAPLink, SWD interface
#  Target      : STM32H723ZGTx (Cortex-M7, single core)
# ============================================================

# --- DAPLink probe (CMSIS-DAP compatible) ---
adapter driver cmsis-dap

# --- Debug transport: SWD ---
transport select swd

# --- Work area (RAM scratch) for flash loader: 1M ---
set FLASH_SIZE 0x100000

# --- STM32H7 target definition (auto-detects CPU/flash) ---
source [find target/stm32h7x.cfg]

# --- SWD clock speed in kHz (MUST stay below the target source) ---
# target/stm32h7x.cfg (upstream, CubeCLT 0.12.0) resets "adapter speed 4000"
# ("Clock after reset is HSI at 64 MHz") and silently overrides any speed set
# before it — this file's 10000 never actually took effect until the line was
# moved below the source (2026-10-01; verified: init now reports 10000 kHz).
adapter speed 10000
